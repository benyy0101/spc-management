version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: spc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - spc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spc_postgres_data:
